<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Uber Hours Tracker</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;color:#1d1d1f;background:#faf9f6;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;background:#faf9f6}
    main{width:min(100%,520px);min-height:calc(100vh - 40px);margin:20px auto;padding:0 20px 146px;border-radius:30px;background:#faf9f6;overflow:hidden}
    .view{display:none}.view.active{display:block}
    .home-hero{margin:0 -20px 24px;padding:28px 20px 30px;background:#1d1d1f;border-radius:0 0 28px 28px;color:#fff}
    .eyebrow{margin:0 0 8px;color:#cccccc;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    h1,h2,p{margin-top:0}h1{margin-bottom:10px;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:0}h2{margin-bottom:18px;font-size:19px;font-weight:600;letter-spacing:0}.hero-caption{margin:0;color:#cccccc;font-size:13px}
    .progress-stack{display:grid;gap:16px;margin-bottom:24px}
    .progress-item{padding:24px 20px 22px;border:1px solid #edf0f6;border-radius:30px;background:#fff}
    .progress-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .progress-title{font-size:16px;font-weight:750}.progress-value{font-size:15px;font-weight:700;color:#59667c;white-space:nowrap}
    .progress-track{height:30px;overflow:hidden;border-radius:999px;background:#edf1f7}.progress-fill{height:100%;width:0;border-radius:inherit;transition:width .25s ease}
    .progress-fill.dynamic,.progress-fill.normal{background:#0066cc}
    .progress-detail{display:flex;justify-content:space-between;margin-top:9px;color:#8791a3;font-size:13px}
    .sessions-launch,.stats-launch{position:fixed;z-index:4;right:max(20px,calc((100vw - 520px)/2 + 20px));display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0;border:1px solid #e0e6f0;border-radius:50%;background:#fff;color:#0066cc;font-size:21px;line-height:1;cursor:pointer}.sessions-launch{bottom:144px}.stats-launch{bottom:204px}.stats-glyph{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:16px;height:16px}.stats-glyph i{display:block;width:3px;border-radius:3px;background:#0066cc}.stats-glyph i:nth-child(1){height:7px}.stats-glyph i:nth-child(2){height:11px}.stats-glyph i:nth-child(3){height:15px}
    button{font:inherit;font-weight:750;cursor:pointer}button:disabled{cursor:default;opacity:.45}
    .session-dock{position:fixed;z-index:5;right:0;bottom:16px;left:0;padding:12px 20px}.session-dock[hidden]{display:none}.dock-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;width:min(100%,480px);margin:auto;padding:14px 14px 14px 22px;border:2px solid #0066cc;border-radius:999px;background:#fff}.dock-copy{min-width:0}.dock-label{margin:0;color:#1d1d1f;font-size:17px;font-weight:700}.dock-timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.dock-timer[hidden]{display:none}
    .round-action{display:grid;flex:0 0 auto;place-items:center;width:56px;height:56px;border:1px solid #0066cc;border-radius:50%;background:#0066cc;color:#fff;font-size:22px;line-height:1}.round-action.stop{border-color:#e05b52;background:#e05b52}.round-action:focus-visible,.sessions-launch:focus-visible,.back-button:focus-visible,.add-button:focus-visible{outline:2px solid #0071e3;outline-offset:3px}
    .page-header{display:flex;align-items:center;gap:12px;margin:28px 0 28px}.back-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid #e0e0e0;border-radius:50%;background:#fff;color:#1d1d1f;font-size:22px;line-height:1;cursor:pointer}.page-header h1{margin:0;font-size:31px;font-weight:600}.calendar-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.calendar-title{margin:0;font-size:20px;font-weight:600}.month-nav{display:flex;gap:8px}.month-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid #e0e0e0;border-radius:50%;background:#fff;color:#1d1d1f;font-size:22px;line-height:1}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.calendar-weekdays{margin-bottom:8px;color:#7a7a7a;font-size:11px;font-weight:700;text-align:center}.calendar-grid{grid-auto-rows:minmax(62px,1fr)}.calendar-day{display:flex;min-width:0;flex-direction:column;justify-content:space-between;padding:9px 7px;border:1px solid #e0e0e0;border-radius:14px;background:#f5f4f1;color:#7a7a7a;font-size:12px}.calendar-day.empty{border-color:transparent;background:transparent}.calendar-day.worked{border-color:#0066cc;background:#fff;color:#1d1d1f}.day-number{font-weight:700}.day-hours{color:#0066cc;font-size:11px;font-weight:700}
    .panel{padding:18px;border:1px solid #edf0f6;border-radius:18px;background:#fff}.manual-panel{margin-bottom:16px}.field-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}label{display:grid;gap:7px;color:#778298;font-size:12px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #e0e6f0;border-radius:10px;background:#fbfcfe;color:#273247;font:inherit}input:focus{border-color:#6d99ef;outline:3px solid #dce8ff}
    .primary-button{padding:12px 16px;border:1px solid #0066cc;border-radius:999px;background:#0066cc;color:#fff;cursor:pointer}.add-submit{display:block;margin-left:auto}.session-actions{position:fixed;z-index:6;right:max(20px,calc((100vw - 520px)/2 + 20px));bottom:24px;display:flex;flex-direction:column-reverse;align-items:center;gap:10px}.add-button,.clear-button{display:grid;place-items:center;width:52px;height:52px;padding:0;border:1px solid #0066cc;border-radius:50%;background:#0066cc;color:#fff;font-size:25px;line-height:1}.clear-button{border-color:#e0e0e0;background:#fafafc;color:#1d1d1f;font-size:22px}.message{min-height:20px;margin:12px 0 0;color:#d6534e;font-size:13px}.message.success{color:#31845b}
    .session-list{display:grid;gap:10px}.empty-state{padding:24px 0;color:#8791a3;text-align:center}.row{padding:14px;border:1px solid #e0e6f0;border-radius:14px;background:#fff;color:#778298;font-size:12px;line-height:1.5}.row b{color:#273247}
    .sheet-backdrop{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#1d1d1f33;animation:fade-in .2s ease}.sheet-backdrop[hidden]{display:none}.sheet{width:min(100%,440px);padding:10px 20px calc(20px + env(safe-area-inset-bottom));border:1px solid #e0e0e0;border-bottom:0;border-radius:28px 28px 0 0;background:#fff;animation:sheet-up .28s cubic-bezier(.22,1,.36,1)}.sheet-handle{width:36px;height:4px;margin:0 auto 18px;border-radius:999px;background:#d2d2d7}.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:16px}.sheet-header h2{margin:0}.sheet-close{display:grid;place-items:center;width:36px;height:36px;border:1px solid #e0e0e0;border-radius:50%;background:#fafafc;color:#1d1d1f;font-size:22px;line-height:1}.sheet-copy{margin:0 0 18px;color:#7a7a7a;font-size:13px;line-height:1.5}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions button{min-height:46px;cursor:pointer}.sheet-danger{border-color:#e05b52;background:#e05b52}.sheet-cancel{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d2d2d7;border-radius:999px;background:#fff;color:#1d1d1f;font:inherit;font-weight:600;cursor:pointer}.sheet-cancel:hover{background:#f5f5f7}.sheet-cancel:focus-visible{outline:2px solid #0071e3;outline-offset:3px}
    .calendar-weekdays,.calendar-grid{gap:10px}.calendar-weekdays{margin-bottom:10px;font-size:12px}.calendar-grid{grid-auto-rows:minmax(96px,1fr)}.calendar-day{align-items:center;justify-content:center;gap:10px;padding:12px 5px;border-radius:999px;font-size:15px;text-align:center}.day-number{font-size:16px}.day-hours{display:grid;gap:2px;font-size:13px;line-height:1.05}.day-hours span{display:block}.calendar-glyph{position:relative;width:17px;height:15px;border:2px solid #0066cc;border-radius:4px}.calendar-glyph:before{position:absolute;top:3px;right:1px;left:1px;border-top:2px solid #0066cc;content:""}.calendar-glyph:after{position:absolute;top:-5px;left:3px;width:7px;height:5px;border-right:2px solid #0066cc;border-left:2px solid #0066cc;content:""}
    .calendar-day:not(.worked) .day-hours{display:none}
    @media(max-width:520px){.calendar-weekdays,.calendar-grid{gap:6px}.calendar-grid{grid-auto-rows:minmax(88px,1fr)}.calendar-day{padding:10px 3px}.day-number{font-size:15px}.day-hours{font-size:12px}}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @media(max-width:520px){main{min-height:100vh;margin:0;border-radius:0;padding:0 16px 100px}.home-hero{margin-left:-16px;margin-right:-16px}.sessions-launch,.stats-launch{right:20px}.sessions-launch{bottom:144px}.stats-launch{bottom:204px}.calendar-weekdays,.calendar-grid{gap:5px}.calendar-grid{grid-auto-rows:minmax(58px,1fr)}.calendar-day{padding:8px 5px}.dock-inner{gap:12px}.dock-timer{font-size:18px}}
    @media(max-width:520px){.calendar-weekdays,.calendar-grid{gap:6px}.calendar-grid{grid-auto-rows:minmax(88px,1fr)}.calendar-day{align-items:center;justify-content:center;gap:8px;padding:10px 3px;border-radius:999px}.day-number{font-size:15px}.day-hours{font-size:12px}}
  </style>
</head>
<body>
  <main>
    <section id="homeView" class="view active" aria-labelledby="homeTitle">
      <div class="home-hero"><p class="eyebrow">Work progress</p><h1 id="homeTitle">Uber Hours Tracker</h1><p class="hero-caption">Keep your driving plan on track.</p></div>
      <div class="progress-stack" aria-label="Hours progress">
        <article class="progress-item">
          <div class="progress-head"><span class="progress-title">Dynamic hours</span><span class="progress-value" id="dyn">0h 00m</span></div>
          <div class="progress-track"><div id="dynBar" class="progress-fill dynamic"></div></div>
          <div class="progress-detail"><span>Progress</span><span><span id="dynLeft">135h 00m</span> left</span></div>
        </article>
        <article class="progress-item">
          <div class="progress-head"><span class="progress-title">Normal hours</span><span class="progress-value" id="norm">0h 00m</span></div>
          <div class="progress-track"><div id="normBar" class="progress-fill normal"></div></div>
          <div class="progress-detail"><span>Progress</span><span><span id="normLeft">85h 00m</span> left</span></div>
        </article>
      </div>
      <button id="openStats" class="stats-launch" aria-label="Open stats" title="Open stats"><span class="calendar-glyph" aria-hidden="true"></span></button><button id="openSessions" class="sessions-launch" aria-label="Open sessions" title="Open sessions">&#9776;</button>
    </section>

    <section id="statsView" class="view" aria-labelledby="statsTitle">
      <div class="page-header"><button id="backStats" class="back-button" aria-label="Back to overview" title="Back to overview">&#8592;</button><h1 id="statsTitle">Stats</h1></div>
      <div class="calendar-header"><h2 id="calendarTitle" class="calendar-title"></h2><div class="month-nav"><button id="prevMonth" class="month-button" aria-label="Previous month" title="Previous month">&#8592;</button><button id="nextMonth" class="month-button" aria-label="Next month" title="Next month">&#8594;</button></div></div>
      <div class="calendar-weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendarGrid" class="calendar-grid" aria-label="Monthly work calendar"></div>
    </section>

    <section id="sessionsView" class="view" aria-labelledby="sessionsTitle">
      <div class="page-header"><button id="backHome" class="back-button" aria-label="Back to overview" title="Back to overview">&#8592;</button><h1 id="sessionsTitle">Sessions</h1></div>
      <div class="calendar-header"><h2 id="sessionsMonthTitle" class="calendar-title"></h2><div class="month-nav"><button id="prevSessionsMonth" class="month-button" aria-label="Previous month" title="Previous month">&#8592;</button><button id="nextSessionsMonth" class="month-button" aria-label="Next month" title="Next month">&#8594;</button></div></div>
      <div id="list" class="session-list"></div>
      <div class="session-actions"><button id="toggleManual" class="add-button" aria-label="Add session" title="Add session">&#43;</button><button id="clear" class="clear-button" aria-label="Reset sessions" title="Reset sessions">&#8635;</button></div>
    </section>
  </main>

  <div id="addModal" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
      <div class="sheet-handle"></div><div class="sheet-header"><h2 id="addModalTitle">Add a session</h2><button id="closeAdd" class="sheet-close" aria-label="Close add session">&#215;</button></div>
      <div class="field-grid"><label>Start<input id="ms" type="datetime-local"></label><label>Finish<input id="me" type="datetime-local"></label></div>
      <button id="add" class="primary-button add-submit" type="button">Add session</button><p class="message" id="msg" aria-live="polite"></p>
    </section>
  </div>
  <div id="resetModal" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
      <div class="sheet-handle"></div><div class="sheet-header"><h2 id="resetModalTitle">Reset sessions?</h2><button id="closeReset" class="sheet-close" aria-label="Close reset confirmation">&#215;</button></div>
      <p class="sheet-copy">This will remove all saved sessions from this device.</p><div class="sheet-actions"><button id="cancelReset" class="sheet-cancel" type="button">Cancel</button><button id="confirmReset" class="primary-button sheet-danger" type="button">Reset sessions</button></div>
    </section>
  </div>

  <footer id="sessionDock" class="session-dock" aria-label="Current session controls">
    <div class="dock-inner"><div class="dock-copy"><div class="dock-label" id="dockLabel">Start</div><div class="dock-timer" id="timer" hidden>00:00:00</div></div><button id="sessionAction" class="round-action" aria-label="Start session" title="Start session">&#9654;</button></div>
  </footer>

  <script>
    const DG=135*36e5,NG=85*36e5;
    let ss=JSON.parse(localStorage.getItem('sessions')||'[]'),active=localStorage.getItem('activeStart');
    active=active?new Date(active):null;
    const $=x=>document.getElementById(x),pad=x=>String(x).padStart(2,'0');
    function fd(ms){let m=Math.round(Math.max(0,ms)/6e4);return Math.floor(m/60)+'h '+pad(m%60)+'m'}
    function dyn(d){let w=d.getDay(),h=d.getHours()+d.getMinutes()/60;if(w>=1&&w<=3)return h>=18&&h<21;if(w===4)return h>=18;if(w===5)return h<3||h>=18;if(w===0||w===6)return h<7||h>=18;return false}
    function split(a,b){a=new Date(a);b=new Date(b);let d=0,n=0,c=new Date(a);while(c<b){let x=new Date(c);x.setMinutes(0,0,0);x.setHours(x.getHours()+1);if(x>b)x=b;let mid=new Date((+c + +x)/2),z=x-c;(dyn(mid)?d+=z:n+=z);c=x}return{d,n}}
    function save(){localStorage.setItem('sessions',JSON.stringify(ss))}
    let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),sessionsMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
    function dayHours(day){let start=new Date(day.getFullYear(),day.getMonth(),day.getDate()),end=new Date(start);end.setDate(end.getDate()+1);return ss.reduce((total,s)=>{let a=Math.max(+start,+new Date(s.a)),b=Math.min(+end,+new Date(s.b));return total+Math.max(0,b-a)},0)}
    function dayLabel(ms){let minutes=Math.round(Math.max(0,ms)/6e4);return '<span>'+Math.floor(minutes/60)+'h</span><span>'+pad(minutes%60)+'m</span>'}
    function renderCalendar(){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);$('calendarTitle').textContent=calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});let html='';for(let i=0;i<first.getDay();i++)html+='<div class="calendar-day empty" aria-hidden="true"></div>';for(let day=1;day<=last.getDate();day++){let date=new Date(y,m,day),hours=dayHours(date),worked=hours>0;html+='<div class="calendar-day'+(worked?' worked':'')+'" aria-label="'+date.toLocaleDateString()+': '+fd(hours)+'"><span class="day-number">'+day+'</span><span class="day-hours">'+dayLabel(hours)+'</span></div>'}$('calendarGrid').innerHTML=html}
    function renderSessions(){let start=new Date(sessionsMonth),end=new Date(sessionsMonth.getFullYear(),sessionsMonth.getMonth()+1,1),visible=ss.filter(s=>new Date(s.b)>start&&new Date(s.a)<end);$('sessionsMonthTitle').textContent=sessionsMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});$('list').innerHTML=visible.length?visible.slice().reverse().map(s=>{let z=split(s.a,s.b);return '<div class="row">'+new Date(s.a).toLocaleString()+' &#8594; '+new Date(s.b).toLocaleString()+'<br><b>Dynamic '+fd(z.d)+'</b> &middot; <b>Normal '+fd(z.n)+'</b></div>'}).join(''):'<div class="empty-state">No sessions this month.</div>'}
    function render(){let d=0,n=0;ss.forEach(s=>{let z=split(s.a,s.b);d+=z.d;n+=z.n});$('dyn').textContent=fd(d);$('norm').textContent=fd(n);$('dynLeft').textContent=fd(DG-d);$('normLeft').textContent=fd(NG-n);$('dynBar').style.width=Math.min(100,d/DG*100)+'%';$('normBar').style.width=Math.min(100,n/NG*100)+'%';renderSessions();renderCalendar()}
    function setView(view){$('homeView').classList.toggle('active',view==='home');$('statsView').classList.toggle('active',view==='stats');$('sessionsView').classList.toggle('active',view==='sessions');$('sessionDock').hidden=view!=='home';closeSheets()}
    function updateSessionState(){let live=!!active,button=$('sessionAction');button.classList.toggle('stop',live);button.innerHTML=live?'&#9632;':'&#9654;';button.setAttribute('aria-label',live?'End session':'Start session');button.title=live?'End session':'Start session';$('dockLabel').textContent=live?'':'Start';$('timer').hidden=!live}
    $('sessionAction').onclick=()=>{if(active){ss.push({a:active.toISOString(),b:new Date().toISOString()});save();active=null;localStorage.removeItem('activeStart');render()}else{active=new Date();localStorage.setItem('activeStart',active.toISOString())}updateSessionState()};
    function closeSheets(){$('addModal').hidden=true;$('resetModal').hidden=true}
    function openSheet(id){closeSheets();$(id).hidden=false}
    $('openStats').onclick=()=>setView('stats');$('backStats').onclick=()=>setView('home');$('openSessions').onclick=()=>{renderSessions();setView('sessions')};$('backHome').onclick=()=>setView('home');$('prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar()};$('prevSessionsMonth').onclick=()=>{sessionsMonth.setMonth(sessionsMonth.getMonth()-1);renderSessions()};$('nextSessionsMonth').onclick=()=>{sessionsMonth.setMonth(sessionsMonth.getMonth()+1);renderSessions()};$('toggleManual').onclick=()=>openSheet('addModal');$('closeAdd').onclick=closeSheets;
    $('add').onclick=()=>{let a=new Date($('ms').value),b=new Date($('me').value);if(!$('ms').value||!$('me').value||b<=a){$('msg').textContent='Please enter a valid start and finish.';$('msg').classList.remove('success');return}ss.push({a:a.toISOString(),b:b.toISOString()});save();$('msg').textContent='Session added.';$('msg').classList.add('success');$('ms').value='';$('me').value='';render();setTimeout(closeSheets,180)};
    $('clear').onclick=()=>openSheet('resetModal');$('closeReset').onclick=closeSheets;$('cancelReset').onclick=closeSheets;$('confirmReset').onclick=()=>{ss=[];save();render();closeSheets()};
    document.querySelectorAll('.sheet-backdrop').forEach(sheet=>sheet.onclick=e=>{if(e.target===sheet)closeSheets()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});
    setInterval(()=>{if(!active){$('timer').textContent='00:00:00';return}let now=new Date(),sec=Math.floor((now-active)/1000);$('timer').textContent=pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60)},1000);
    updateSessionState();setView('home');render();
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
